<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif" font-weight="900">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eef8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="#1c2a45"/>
  <!-- Crowd -->
  <g opacity=".85">
    <circle cx="20" cy="22" r="7" fill="#e63946"/><circle cx="46" cy="30" r="7" fill="#f4a261"/>
    <circle cx="78" cy="20" r="7" fill="#2a9d8f"/><circle cx="108" cy="30" r="7" fill="#ffd166"/>
    <circle cx="140" cy="20" r="7" fill="#8e7dbe"/><circle cx="176" cy="30" r="7" fill="#4d9de0"/>
    <circle cx="208" cy="20" r="7" fill="#e63946"/><circle cx="240" cy="30" r="7" fill="#06d6a0"/>
    <circle cx="272" cy="20" r="7" fill="#f4a261"/><circle cx="302" cy="30" r="7" fill="#ffd166"/>
  </g>
  <!-- Boards and glass -->
  <rect y="44" width="320" height="22" fill="#f2f4f7"/>
  <rect y="58" width="320" height="8" fill="#f2c230"/>

  <!-- Ice -->
  <rect y="66" width="320" height="114" fill="url(#ice)"/>
  <path d="M0 150Q160 120 320 150" fill="none" stroke="#2a5fd1" stroke-width="4"/>
  <circle cx="80" cy="150" r="30" fill="none" stroke="#d23a3a" stroke-width="2"/>

  <!-- Net -->
  <g>
    <rect x="212" y="62" width="80" height="58" fill="#fff" fill-opacity=".55" stroke="#d62828" stroke-width="6"/>
    <path d="M222 62v58M232 62v58M242 62v58M252 62v58M262 62v58M272 62v58M282 62v58M212 76h80M212 90h80M212 104h80" stroke="#c9d2dc" stroke-width="1.5"/>
    <circle cx="252" cy="40" r="9" fill="#ff2a2a"/>
  </g>

  <!-- Puck in flight with a streak -->
  <path d="M150 128 215 94" stroke="#0b0b0d" stroke-opacity=".25" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="218" cy="92" rx="9" ry="4.5" fill="#0b0b0d"/>

  <!-- Skater -->
  <g transform="translate(96 0)">
    <path d="M10 160h56" stroke="#c8ced6" stroke-width="3" stroke-linecap="round"/>
    <rect x="16" y="122" width="12" height="36" rx="5" fill="#fff"/>
    <rect x="34" y="124" width="12" height="34" rx="5" fill="#fff" transform="rotate(14 40 124)"/>
    <rect x="12" y="150" width="22" height="8" rx="3" fill="#15181d"/>
    <rect x="38" y="152" width="22" height="8" rx="3" fill="#15181d"/>
    <path d="M14 82q16-12 34 0l4 44H12Z" fill="#2a6fd1"/>
    <rect x="12" y="104" width="40" height="7" fill="#fff"/>
    <path d="M48 90 82 112" stroke="#f1b48a" stroke-width="9" stroke-linecap="round"/>
    <path d="M60 134 108 122" stroke="#2b2f36" stroke-width="4" stroke-linecap="round"/>
    <path d="M104 126l12-5" stroke="#f2f2ee" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="64" r="15" fill="#f1b48a"/>
    <path d="M16 62a16 16 0 0 1 32 0v4H16Z" fill="#fff"/>
  </g>

  <text x="160" y="172" text-anchor="middle" font-size="16" fill="#1c2a45" opacity=".0">Slap Shot</text>
</svg>
