<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif" font-weight="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a97e0"/>
      <stop offset="1" stop-color="#bfe0f8"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffa45c"/>
      <stop offset="1" stop-color="#d9631a"/>
    </radialGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- Trees and fence -->
  <circle cx="40" cy="62" r="26" fill="#3f9a3c"/>
  <circle cx="64" cy="72" r="20" fill="#4fae45"/>
  <circle cx="276" cy="58" r="24" fill="#2f8a40"/>
  <rect x="0" y="88" width="320" height="26" fill="#9aa3ad" opacity=".55"/>
  <path d="M0 88h320M0 100h320M0 112h320" stroke="#ffffff" stroke-opacity=".5" stroke-width="1"/>

  <!-- Court -->
  <rect y="112" width="320" height="68" fill="#3f7f86"/>
  <path d="M110 112 70 180h180l-40-68Z" fill="#b5533c"/>
  <path d="M0 150Q160 96 320 150" fill="none" stroke="#f5f5f5" stroke-width="3"/>
  <path d="M110 112 70 180M210 112l40 68" stroke="#f5f5f5" stroke-width="3"/>

  <!-- Pole, backboard and hoop -->
  <rect x="156" y="40" width="8" height="74" fill="#3b3f46"/>
  <rect x="116" y="8" width="88" height="52" rx="3" fill="#fff" stroke="#c9ced6" stroke-width="2"/>
  <rect x="146" y="30" width="28" height="22" fill="none" stroke="#d23b2f" stroke-width="3"/>
  <ellipse cx="160" cy="56" rx="17" ry="5" fill="none" stroke="#ff6a1a" stroke-width="4"/>
  <path d="M144 58l6 18h20l6-18M152 60l3 16M160 60v16M168 60l-3 16" fill="none" stroke="#fff" stroke-width="1.5" opacity=".9"/>

  <!-- Player jumping -->
  <g transform="translate(246 70)">
    <ellipse cx="0" cy="96" rx="16" ry="4" fill="#000" opacity=".25"/>
    <rect x="-10" y="36" width="20" height="28" rx="8" fill="#f3f4f8"/>
    <rect x="-10" y="60" width="20" height="10" rx="3" fill="#1c2f6b"/>
    <rect x="-9" y="68" width="7" height="22" rx="3" fill="#f1b48a" transform="rotate(14 -5 68)"/>
    <rect x="3" y="68" width="7" height="22" rx="3" fill="#f1b48a" transform="rotate(-24 6 68)"/>
    <circle cx="0" cy="26" r="11" fill="#f1b48a"/>
    <path d="M-11 22q11-12 22 0" fill="none" stroke="#1c2f6b" stroke-width="4"/>
    <rect x="6" y="2" width="6" height="34" rx="3" fill="#f1b48a" transform="rotate(22 9 36)"/>
    <rect x="-14" y="6" width="6" height="30" rx="3" fill="#f1b48a" transform="rotate(-26 -11 36)"/>
  </g>

  <!-- Ball in flight with a motion arc -->
  <path d="M230 128Q210 64 172 52" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" opacity=".85"/>
  <circle cx="198" cy="64" r="12" fill="url(#ball)"/>
  <path d="M186 64h24M198 52v24" stroke="#1b1008" stroke-width="1.6" fill="none"/>
</svg>
