<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" font-weight="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#d8f4ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fe0d6"/>
      <stop offset="1" stop-color="#119fa0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Sun and clouds -->
  <circle cx="548" cy="70" r="34" fill="#fff4a8"/>
  <g fill="#fff" opacity=".92">
    <ellipse cx="96" cy="84" rx="44" ry="14"/><ellipse cx="124" cy="72" rx="28" ry="14"/>
    <ellipse cx="410" cy="52" rx="40" ry="12"/><ellipse cx="434" cy="42" rx="24" ry="12"/>
  </g>

  <!-- A palm island on the horizon -->
  <ellipse cx="96" cy="226" rx="78" ry="14" fill="#ffe2a0"/>
  <path d="M92 222c4-26 2-48-6-70" stroke="#9a6a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g fill="#34b255">
    <path d="M86 152c-26-4-44 6-52 22 20-8 36-10 52-4Z"/>
    <path d="M86 152c22-12 44-8 58 6-22-6-38-6-58 2Z"/>
    <path d="M86 152c-8-20-24-30-42-28 16 6 28 14 36 28Z"/>
    <path d="M86 152c12-18 30-24 46-18-16 4-30 12-40 24Z"/>
  </g>
  <rect y="226" width="640" height="134" fill="url(#sea)"/>
  <path d="M0 250c40-8 80 8 120 0s80-8 120 0 80 8 120 0 80-8 120 0 80 8 160 0v8H0Z" fill="#fff" opacity=".25"/>

  <!-- The kicker ramp -->
  <path d="M60 330 250 330 250 286Z" fill="#e8403a"/>
  <path d="M140 330 250 330 250 286 224 286Z" fill="#fff"/>
  <rect x="56" y="330" width="198" height="12" rx="6" fill="#ffd43b"/>

  <!-- Spray under the ski -->
  <g fill="#fff" opacity=".9">
    <circle cx="300" cy="300" r="12"/><circle cx="330" cy="310" r="9"/><circle cx="270" cy="314" r="8"/>
    <circle cx="352" cy="296" r="7"/><circle cx="318" cy="286" r="6"/>
  </g>

  <!-- The jet ski mid-backflip, nose pointing back over the top -->
  <g transform="translate(330 160) rotate(205)">
    <path d="M-92 18c14 0 18-8 40-8h60l32-24c4 12 3 26-3 38-10 16-30 20-58 20h-50c-14 0-21-8-21-26Z" fill="#fff" stroke="#c9d6e0" stroke-width="3"/>
    <path d="M-92 18c14 0 18-8 40-8h60l32-24" fill="none" stroke="#ff4f8b" stroke-width="9" stroke-linecap="round"/>
    <path d="M-50 0h46l-8-16h-24Z" fill="#23232e"/>
    <path d="M30-16l-10-24h-14" fill="none" stroke="#c9ced9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The rider: a kid in an orange vest and a red helmet, tucked in -->
    <ellipse cx="-24" cy="-22" rx="16" ry="22" fill="#ff7a1a"/>
    <circle cx="-8" cy="-52" r="15" fill="#f1b48a"/>
    <path d="M-23-54a15 15 0 0 1 30-4v8h-30Z" fill="#e8403a"/>
    <circle cx="2" cy="-52" r="2.6" fill="#1b1b24"/>
    <path d="M-10-44q6 5 12 0" stroke="#5b2a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-16-26 18-40" stroke="#f1b48a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Motion curl and the comic word -->
  <path d="M232 220c-34-70 30-130 96-120" stroke="#fff" stroke-width="5" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <text x="560" y="330" text-anchor="middle" font-size="46" font-style="italic" fill="#fff" stroke="#ff4f8b" stroke-width="9" paint-order="stroke" transform="rotate(-6 560 330)">SPLASH!</text>
</svg>
