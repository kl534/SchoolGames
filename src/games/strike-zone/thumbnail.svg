<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" font-weight="800">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a12"/>
      <stop offset="1" stop-color="#2a2238"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf9a"/>
      <stop offset="1" stop-color="#cf9a58"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#1d3f9a"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d6cc"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcbbf"/>
    </linearGradient>
    <g id="p">
      <path d="M0 0c-4 0-6 3-6 7 0 4 2 5 2 8 0 5-5 10-5 20 0 6 3 9 9 9s9-3 9-9c0-10-5-15-5-20 0-3 2-4 2-8 0-4-2-7-6-7Z" fill="url(#pin)" stroke="#9c988c" stroke-width=".8"/>
      <rect x="-4.2" y="13" width="8.4" height="2" fill="#d62828"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#room)"/>

  <!-- Printed panel above the pins -->
  <rect x="150" y="20" width="340" height="58" rx="3" fill="#1c2f6b"/>
  <rect x="150" y="20" width="340" height="6" fill="#d62828"/>
  <rect x="150" y="72" width="340" height="6" fill="#f7f5ef"/>
  <text x="320" y="62" text-anchor="middle" font-size="30" fill="#ffd166" stroke="#0a1236" stroke-width="3" paint-order="stroke">STRIKE ZONE</text>
  <rect x="150" y="78" width="340" height="40" fill="#050409"/>

  <!-- Gutters and lane -->
  <path d="M232 118L408 118L560 360L80 360Z" fill="#2b2f36"/>
  <path d="M250 118L390 118L520 360L120 360Z" fill="url(#lane)"/>
  <g stroke="#a8732f" stroke-opacity=".35" stroke-width="1">
    <path d="M285 118L255 360M320 118L320 360M355 118L385 360M268 118L188 360M372 118L452 360"/>
  </g>
  <path d="M120 360L250 118" stroke="#000" stroke-opacity=".25" stroke-width="2" fill="none"/>
  <path d="M286 262l-8 20h16Z M320 262l-8 20h16Z M354 262l-8 20h16Z" fill="#7a1f1f" transform="translate(0 -30)"/>

  <!-- Pins at the far end -->
  <g>
    <use href="#p" transform="translate(320 122) scale(.9)"/>
    <use href="#p" transform="translate(309 114) scale(.9)"/>
    <use href="#p" transform="translate(331 114) scale(.9)"/>
    <use href="#p" transform="translate(298 106) scale(.9)"/>
    <use href="#p" transform="translate(320 106) scale(.9)"/>
    <use href="#p" transform="translate(342 106) scale(.9)"/>
  </g>

  <!-- The aim arrow and the ball -->
  <path d="M318 330L322 190" stroke="#ffd166" stroke-width="9" stroke-linecap="round" opacity=".95"/>
  <path d="M322 160L308 198L336 198Z" fill="#ffd166" opacity=".95"/>
  <ellipse cx="318" cy="346" rx="30" ry="6" fill="#000" fill-opacity=".3"/>
  <circle cx="318" cy="322" r="28" fill="url(#ball)" stroke="#0e2766" stroke-width="2"/>
  <circle cx="310" cy="312" r="3.5" fill="#0a1230"/>
  <circle cx="322" cy="310" r="3.5" fill="#0a1230"/>
  <circle cx="317" cy="321" r="3.5" fill="#0a1230"/>
</svg>
