<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" font-weight="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ba3ff" />
      <stop offset="1" stop-color="#ffe6c2" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)" />
  <!-- buildings -->
  <rect x="20" y="70" width="130" height="190" fill="#8b5e3c" />
  <rect x="160" y="110" width="110" height="150" fill="#4a6fa5" />
  <rect x="400" y="60" width="120" height="200" fill="#9c9a8f" />
  <rect x="530" y="100" width="110" height="160" fill="#8b5e3c" />
  <g fill="#ffe9a8" opacity="0.9">
    <rect x="40" y="90" width="22" height="22" /><rect x="80" y="90" width="22" height="22" /><rect x="40" y="130" width="22" height="22" />
    <rect x="180" y="130" width="22" height="22" /><rect x="220" y="170" width="22" height="22" />
    <rect x="420" y="80" width="22" height="22" /><rect x="460" y="120" width="22" height="22" />
    <rect x="550" y="120" width="22" height="22" /><rect x="590" y="160" width="22" height="22" />
  </g>
  <!-- sidewalk and road -->
  <rect y="250" width="640" height="26" fill="#9fa5b0" />
  <rect y="276" width="640" height="84" fill="#3d4048" />
  <g fill="#f1f1ea"><rect x="30" y="335" width="70" height="7" /><rect x="190" y="335" width="70" height="7" /><rect x="350" y="335" width="70" height="7" /><rect x="510" y="335" width="70" height="7" /></g>
  <!-- hero: a flying kick -->
  <g transform="rotate(-12 220 210)">
    <ellipse cx="215" cy="322" rx="40" ry="8" fill="#000" opacity="0.2" />
    <rect x="150" y="215" width="22" height="64" rx="10" fill="#1d4ed8" transform="rotate(35 161 215)" />
    <rect x="195" y="222" width="96" height="24" rx="12" fill="#1d4ed8" />
    <rect x="282" y="218" width="40" height="18" rx="8" fill="#f4f4f4" />
    <ellipse cx="190" cy="185" rx="34" ry="46" fill="#d7263d" transform="rotate(30 190 185)" />
    <rect x="200" y="150" width="70" height="18" rx="9" fill="#f1b48a" transform="rotate(-20 200 150)" />
    <rect x="150" y="165" width="60" height="18" rx="9" fill="#f1b48a" transform="rotate(25 150 165)" />
    <circle cx="228" cy="128" r="30" fill="#f1b48a" />
    <rect x="198" y="114" width="60" height="9" rx="4" fill="#fff" />
    <circle cx="240" cy="131" r="4" fill="#1b1b24" /><circle cx="220" cy="131" r="4" fill="#1b1b24" />
    <path d="M222 144 q8 7 16 0" stroke="#5b2a22" stroke-width="3" fill="none" />
  </g>
  <!-- toy robot -->
  <g>
    <ellipse cx="400" cy="322" rx="44" ry="9" fill="#000" opacity="0.25" />
    <rect x="378" y="262" width="20" height="60" rx="9" fill="#cdd5df" />
    <rect x="410" y="262" width="20" height="60" rx="9" fill="#cdd5df" />
    <rect x="370" y="316" width="32" height="10" rx="4" fill="#374151" /><rect x="406" y="316" width="32" height="10" rx="4" fill="#374151" />
    <rect x="368" y="178" width="72" height="90" rx="10" fill="#4cc9f0" />
    <rect x="384" y="196" width="40" height="26" rx="4" fill="#e5e9f0" />
    <circle cx="396" cy="209" r="5" fill="#e63946" /><circle cx="412" cy="209" r="5" fill="#4ade80" />
    <circle cx="450" cy="210" r="16" fill="#4cc9f0" /><circle cx="352" cy="214" r="16" fill="#4cc9f0" />
    <rect x="364" y="110" width="80" height="66" rx="10" fill="#e5e9f0" />
    <circle cx="386" cy="136" r="14" fill="#fff" /><circle cx="424" cy="136" r="14" fill="#fff" />
    <circle cx="390" cy="140" r="7" fill="#1b1b24" /><circle cx="428" cy="140" r="7" fill="#1b1b24" />
    <path d="M388 158 q16 12 32 0" stroke="#4a1d1d" stroke-width="4" fill="none" stroke-linecap="round" />
    <rect x="402" y="88" width="4" height="24" fill="#e5e9f0" /><circle cx="404" cy="84" r="8" fill="#e63946" />
    <g fill="#ffc928"><rect x="344" y="150" width="22" height="30" rx="4" /></g>
  </g>
  <!-- fuzzy monster -->
  <g>
    <ellipse cx="545" cy="322" rx="40" ry="8" fill="#000" opacity="0.25" />
    <rect x="525" y="268" width="16" height="54" rx="8" fill="#b185ff" /><rect x="553" y="268" width="16" height="54" rx="8" fill="#b185ff" />
    <circle cx="547" cy="226" r="46" fill="#b185ff" />
    <g fill="#b185ff"><circle cx="505" cy="214" r="12" /><circle cx="590" cy="212" r="12" /><circle cx="510" cy="252" r="12" /><circle cx="586" cy="250" r="12" /><circle cx="530" cy="184" r="12" /><circle cx="566" cy="182" r="12" /></g>
    <ellipse cx="547" cy="238" rx="26" ry="24" fill="#fff3e0" />
    <circle cx="547" cy="198" r="20" fill="#fff" /><circle cx="552" cy="202" r="10" fill="#1b1b24" />
    <path d="M520 230 q27 24 54 0" stroke="#4a1d1d" stroke-width="4" fill="none" stroke-linecap="round" />
    <rect x="538" y="232" width="9" height="12" fill="#fff" /><rect x="549" y="232" width="9" height="12" fill="#fff" />
    <path d="M522 176 l-6 -22 l16 14 z M572 176 l6 -22 l-16 14 z" fill="#fff3d6" />
  </g>
  <!-- comic word -->
  <g transform="rotate(-8 300 80)">
    <text x="300" y="92" text-anchor="middle" font-size="62" fill="#ffe033" stroke="#d61f2c" stroke-width="12" paint-order="stroke" stroke-linejoin="round">CLANG!</text>
  </g>
</svg>
